[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-address-validation-claim-audit"
version = "0.1.0"
description = "Offline audit of documented address claims"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
bitcoin-address-validation-claim-audit = "bitcoin_address_validation_claim_audit.audit:main"
